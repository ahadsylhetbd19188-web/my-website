<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ahad Shop - Online Clothing Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f6fa;
    color: #222;
}

/* NAVBAR */
nav {
    background: #111827;
    padding: 18px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    color: white;
    font-size: 25px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 16px;
}

nav a:hover {
    color: #38bdf8;
}

/* HERO */
.hero {
    min-height: 430px;
    background: linear-gradient(135deg, #1d4ed8, #2563eb, #38bdf8);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    padding: 40px 20px;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 21px;
    margin-bottom: 30px;
}

.order-btn {
    background: white;
    color: #1d4ed8;
    padding: 14px 30px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
}

.order-btn:hover {
    background: #111827;
    color: white;
}

/* SECTION */
section {
    padding: 60px 8%;
}

.section-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 40px;
}

/* PRODUCTS */
.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

.product {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    text-align: center;
    padding-bottom: 20px;
    transition: 0.3s;
}

.product:hover {
    transform: translateY(-8px);
}

.product img {
    width: 100%;
    height: 240px;
    object-fit: cover;
}

.product h3 {
    margin: 18px 5px 10px;
    font-size: 21px;
}

.price {
    color: #e11d48;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.buy-btn {
    display: inline-block;
    background: #2563eb;
    color: white;
    text-decoration: none;
    padding: 11px 25px;
    border-radius: 8px;
    font-weight: bold;
}

.buy-btn:hover {
    background: #111827;
}

/* ABOUT */
.about {
    background: white;
    text-align: center;
}

.about p {
    max-width: 800px;
    margin: auto;
    font-size: 18px;
    line-height: 1.8;
}

/* CONTACT */
.contact {
    text-align: center;
    background: #eef2ff;
}

.contact p {
    margin: 12px 0;
    font-size: 18px;
}

/* FOOTER */
footer {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px;
}

/* MOBILE */
@media(max-width: 900px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 600px) {

    nav {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 0 8px;
        font-size: 14px;
    }

    .hero h1 {
        font-size: 35px;
    }

    .hero p {
        font-size: 17px;
    }

    .products {
        grid-template-columns: 1fr;
    }

    section {
        padding: 45px 5%;
    }
}
</style>
</head>

<body>

<!-- NAVIGATION -->
<nav>

<div class="logo">
Ahad Shop
</div>

<div>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</div>

</nav>


<!-- HOME -->
<section class="hero" id="home">

<div>

<h1>Welcome To Ahad Shop</h1>

<p>Best Quality Clothing Collection</p>

<a class="order-btn"
href="https://wa.me/8801624694415?text=Hello%20Ahad%20Shop%2C%20I%20want%20to%20place%20an%20order."
target="_blank">

Order Now

</a>

</div>

</section>


<!-- PRODUCTS -->
<section id="products">
