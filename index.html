<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahad Shop</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0b5ed7;
color:#fff;
padding:20px;
text-align:center;
}

nav{
background:#083b8a;
padding:10px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:15px;
font-weight:bold;
}

.hero{
padding:70px 20px;
text-align:center;
background:linear-gradient(135deg,#0d6efd,#5aa9ff);
color:white;
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.hero p{
font-size:20px;
}

.btn{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:white;
color:#0d6efd;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}

.products{
padding:50px 20px;
}

.products h2{
text-align:center;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}

.card h3{
margin:10px 0;
}

.price{
color:red;
font-size:22px;
font-weight:bold;
}

button{
margin-top:10px;
padding:10px 20px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}
</style>

</head>

<body>

<header>
<h1>Ahad Shop</h1>
<p>Fashion For Everyone</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>

<section class="hero">
<h1>Welcome To Ahad Shop</h1>
<p>Best Quality Clothing Collection</p>

<a class="btn" href="https://wa.me/">Order Now</a>

</section>

<section class="products">

<h2>Featured Products</h2>

<div class="grid">

<div class="card">

<img src="https://via.placeholder.com/300x300">

<h3>Men T-Shirt</h3>

<p class="price">৳650</p>

<button>Buy Now</button>

</div>

<div class="card">

<img src="https://via.placeholder.com/300x300">

<h3>Women's Dress</h3>

<p class="price">৳1200</p>

<button>Buy Now</button>

</div>

<div class="card">

<img src="https://via.placeholder.com/300x300">

<h3>Kids Collection</h3>

<p class="price">৳850</p>

<button>Buy Now</button>

</div>

<div class="card">

<img src="https://via.placeholder.com/300x300">

<h3>Premium Shirt</h3>

<p class="price">৳990</p>

<button>Buy Now</button>

</div>

</div>

</section>

<footer>

<h3>Ahad Shop</h3>

<p>© 2026 All Rights Reserved.</p>

</footer>

</body>
</html>
