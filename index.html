<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahad Shop - Online Shopping</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html { scroll-behavior: smooth; }

body {
    font-family: Arial, sans-serif;
    background: #f5f5ff;
    color: #222;
}

header {
    background: #111936;
    color: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    width: 48px;
    height: 48px;
    object-fit: contain;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 16px;
}

nav a:hover { color: #38d9a9; }

/* AHAD SHOP POSTER / BANNER */
.ahad-poster {
    width: 100%;
    min-height: 360px;
    margin: 30px 0;
    padding: 20px 30px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    background: linear-gradient(135deg, #071b3a, #075985, #0ea5e9);
    box-shadow: 0 10px 30px rgba(0,0,0,0.20);
}

.ahad-poster::before {
    content: "";
    position: absolute;
    width: 260px;
    height: 260px;
    background: rgba(255,255,255,0.10);
    border-radius: 50%;
    top: -100px;
    right: -80px;
}

.ahad-poster::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
    bottom: -80px;
    left: -50px;
}

.side-logo {
    width: 100px;
    height: 100px;
    flex-shrink: 0;
    z-index: 3;
}

.side-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.poster-content {
    position: relative;
    z-index: 2;
    color: white;
    padding: 35px 20px;
    max-width: 700px;
    flex: 1;
    margin: auto;
}

.poster-badge {
    display: inline-block;
    padding: 7px 18px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 30px;
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.poster-content h1 {
    font-size: 55px;
    margin: 5px 0;
    font-weight: 800;
    letter-spacing: 2px;
}

.poster-subtitle {
    font-size: 19px;
    margin: 10px 0;
    font-weight: 600;
}

.poster-text {
    font-size: 16px;
    line-height: 1.7;
    margin: 18px auto 25px;
    max-width: 560px;
}

.poster-btn {
    display: inline-block;
    background: white;
    color: #075985;
    text-decoration: none;
    padding: 13px 30px;
    border-radius: 30px;
    font-weight: 700;
    transition: 0.3s;
}

.poster-btn:hover {
    transform: translateY(-3px);
    background: #f1f5f9;
}

/* PRODUCTS */
section { padding: 55px 6%; }

.section-title {
    text-align: center;
    font-size: 30px;
    margin-bottom: 35px;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

.product {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    text-align: center;
    transition: 0.3s;
    padding-bottom: 20px;
}

.product:hover { transform: translateY(-8px); }

.product-img {
    width: 100%;
    height: 240px;
    background: #eeeeff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 18px;
}

.product-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product h3 {
    margin-top: 15px;
    font-size: 18px;
}

.price {
    color: #d7263d;
    font-size: 20px;
    font-weight: bold;
    margin: 10px;
}

.buy-btn {
    border: none;
    background: #1455e8;
    color: white;
    padding: 12px 25px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}

.buy-btn:hover { background: #0b3fb5; }

/* ORDER */
.order-section { background: #eeeaff; }

.order-box {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.total-box {
    margin-top: 20px;
    padding: 18px;
    background: #f3f5ff;
    border-radius: 10px;
}

.total-box p { margin: 8px 0; }

.total {
    color: #d7263d;
    font-size: 24px;
    font-weight: bold;
}

.whatsapp-btn {
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    border: none;
    border-radius: 8px;
    background: #18c66d;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.whatsapp-btn:hover { background: #0ca957; }

/* ABOUT */
.about {
    text-align: center;
    max-width: 550px;
    margin: auto;
    line-height: 1.8;
}

/* CONTACT */
.contact {
    text-align: center;
    background: #111936;
    color: white;
}

.contact p { margin: 10px 0; }

/* FOOTER */
footer {
    background: #080d20;
    color: white;
    text-align: center;
    padding: 18px;
}

/* MOBILE */
@media(max-width: 900px) {
    .products { grid-template-columns: repeat(2, 1fr); }
}

@media(max-width: 600px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 0 7px;
        font-size: 14px;
    }

    .side-logo {
        width: 55px;
        height: 55px;
    }

    .ahad-poster {
        min-height: 320px;
        padding: 15px 8px;
    }

    .poster-content { padding: 25px 5px; }

    .poster-content h1 { font-size: 30px; }

    .poster-subtitle { font-size: 14px; }

    .poster-text { font-size: 13px; }

    .poster-btn { padding: 10px 20px; }

    .products { grid-template-columns: 1fr; }

    section { padding: 40px 5%; }
}

.main-banner {
    display: block;
    width: 100%;
    height: auto;
    max-height: 560px;
    object-fit: cover;
    border-radius: 20px;
}
@media (max-width: 600px) {
    .main-banner {
        max-height: none;
        border-radius: 14px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">
